{% extends "base.html" %}
{% block title %}Delete Listing — EVshare{% endblock %}

{% block content %}
<h1 class="page-title">Delete this listing?</h1>
<p class="card-meta">"{{ charger.title }}" in {{ charger.city }} will be permanently removed. This can't be undone.</p>

<form method="post" class="stacked-form form-narrow">
  {% csrf_token %}
  <button type="submit" class="btn btn-outline" style="border-color:#ff6b6b;color:#ff9a9a;">Yes, delete it</button>
  <a href="{% url 'charger_detail' charger.pk %}" class="btn btn-outline">Cancel</a>
</form>
{% endblock %}
